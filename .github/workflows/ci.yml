name: CI

on:
  push:
  pull_request:
  # Run by hand (Actions tab -> CI -> Run workflow) with a version to publish a release.
  workflow_dispatch:
    inputs:
      release_version:
        description: Version to publish as a GitHub release, like 1.2.3 (leave empty for a test build)
        required: false
        default: ''

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  cross-platform:
    name: Core tests + UI tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Core unit tests
        run: dotnet test tests/Watchtower.Core.Tests -c Release

      - name: Build everything (service cross-compiles for Windows)
        run: dotnet build Watchtower.slnx -c Release

      - name: UI unit tests
        working-directory: ui
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
        run: |
          npm ci
          npm test

      - name: UI end-to-end tests (renderer + pipe client + dev host)
        working-directory: ui
        run: |
          dotnet build ../tools/Watchtower.DevHost -c Debug
          npx playwright install --with-deps chromium
          npm run test:e2e

      # The real Electron app (main process, preload, pipe client) through the setup guide.
      - name: Electron app smoke test
        working-directory: ui
        run: |
          sudo apt-get install -y xvfb
          node node_modules/electron/install.js
          xvfb-run -a node test/electron-smoke.js

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: ui/test-results

  windows:
    name: Service smoke test + installer (Windows)
    runs-on: windows-latest
    needs: cross-platform
    env:
      # Secrets can't be tested in step conditions directly; expose whether one exists.
      HAS_SIGNING_CERT: ${{ secrets.SIGNING_CERT_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # A release version (tag v1.2.3 or the Run workflow input) builds that version;
      # anything else builds 0.2.<run number>.
      - name: Pick version
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          if ($env:RELEASE_VERSION) { $v = $env:RELEASE_VERSION.TrimStart('v') }
          elseif ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF_NAME.Substring(1) }
          else { $v = "0.2.$env:GITHUB_RUN_NUMBER" }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Release versions must look like 1.2.3, got '$v'" }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Building version $v"

      - name: Core unit tests on Windows
        run: dotnet test tests/Watchtower.Core.Tests -c Release

      - name: Publish service
        run: dotnet publish src/Watchtower.Service -c Release -o artifacts/service -p:Version=${{ env.VERSION }}

      # Runs the real engine: ETW kernel events, WinVerifyTrust (incl. catalog-signed
      # notepad.exe), TCP table, sessions, and the named pipe with a real caller token.
      - name: Service smoke test
        run: artifacts\service\Watchtower.Service.exe --smoke-test 20 --data-dir "$env:RUNNER_TEMP\wt-smoke"

      - name: Package UI
        working-directory: ui
        run: |
          npm ci
          npm run pack

      - name: Sign binaries
        if: env.HAS_SIGNING_CERT == 'true'
        env:
          SIGNING_CERT: ${{ secrets.SIGNING_CERT_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          $pfx = "$env:RUNNER_TEMP\signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_CERT))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          & $signtool.FullName sign /f $pfx /p $env:SIGNING_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
            artifacts\service\Watchtower.Service.exe artifacts\ui\win-unpacked\Watchtower.exe
          Remove-Item $pfx

      - name: Build installer
        run: dotnet build installer -c Release -p:Version=${{ env.VERSION }}

      - name: Sign installer
        if: env.HAS_SIGNING_CERT == 'true'
        env:
          SIGNING_CERT: ${{ secrets.SIGNING_CERT_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          $pfx = "$env:RUNNER_TEMP\signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_CERT))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          $msi = (Get-ChildItem installer\bin -Recurse -Filter Watchtower.msi | Select-Object -First 1).FullName
          & $signtool.FullName sign /f $pfx /p $env:SIGNING_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $msi
          Remove-Item $pfx

      - name: Install, check the service runs and answers, uninstall
        run: |
          $msi = (Get-ChildItem installer\bin -Recurse -Filter Watchtower.msi | Select-Object -First 1).FullName
          $p = Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /l*v `"$env:RUNNER_TEMP\install.log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\install.log" -Tail 80; throw "Install failed: $($p.ExitCode)" }

          $svc = Get-Service Watchtower
          $svc.WaitForStatus('Running', '00:00:30')
          Write-Host "Service status: $($svc.Status), start type: $($svc.StartType)"
          if ($svc.StartType -ne 'Automatic') { throw 'Service should start automatically' }
          sc.exe qfailure Watchtower

          node ui/test/service-check.js
          if ($LASTEXITCODE -ne 0) { throw 'Installed service failed its checks' }

          # Recovery: kill the service process and expect Windows to restart it.
          Stop-Process -Name Watchtower.Service -Force
          Start-Sleep -Seconds 15
          (Get-Service Watchtower).WaitForStatus('Running', '00:00:30')
          Write-Host 'Service came back after being killed.'

          $p = Start-Process msiexec -ArgumentList "/x `"$msi`" /qn" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Uninstall failed: $($p.ExitCode)" }
          if (Get-Service Watchtower -ErrorAction SilentlyContinue) { throw 'Service still present after uninstall' }

      - name: Service diagnostics
        if: failure()
        run: |
          Get-Service Watchtower -ErrorAction SilentlyContinue | Format-List *
          Get-ChildItem "$env:ProgramData\Watchtower\crashes" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "== $($_.Name)"; Get-Content $_.FullName -Tail 60 }
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddMinutes(-30) } -ErrorAction SilentlyContinue |
            Where-Object { $_.ProviderName -match 'Watchtower|\.NET Runtime|Application Error' } |
            Select-Object -First 30 | Format-List TimeCreated, ProviderName, Id, Message
          Get-WinEvent -FilterHashtable @{ LogName = 'System'; ProviderName = 'Service Control Manager'; StartTime = (Get-Date).AddMinutes(-30) } -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match 'Watchtower' } | Select-Object -First 20 | Format-List TimeCreated, Id, Message

      - uses: actions/upload-artifact@v4
        with:
          name: watchtower-${{ env.VERSION }}
          path: installer/bin/**/Watchtower.msi

  # Pushing a tag like v1.2.3, or running the workflow with a release version, publishes
  # the tested MSI as a GitHub release.
  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_version != ''
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: watchtower-*
          path: dist
          merge-multiple: true

      - name: Name the installer and write checksums
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          if [ -n "$RELEASE_VERSION" ]; then version="${RELEASE_VERSION#v}"; else version="${GITHUB_REF_NAME#v}"; fi
          echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"
          cp "$(find dist -name Watchtower.msi | head -1)" "Watchtower-$version.msi"
          sha256sum "Watchtower-$version.msi" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: |
            Watchtower-*.msi
            SHA256SUMS.txt
          prerelease: true
          generate_release_notes: true
          body: |
            Download the **Watchtower .msi** file below and run it. It installs the background service and the Watchtower app.

            This is a test build and isn't code-signed yet, so Windows SmartScreen may say it "protected your PC". Click **More info**, then **Run anyway**.

            To check the download, compare its SHA-256 (`Get-FileHash .\Watchtower-*.msi`) with SHA256SUMS.txt.
